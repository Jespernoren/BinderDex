<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binderdex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 98 114%22%3E%3Crect width=%2298%22 height=%22114%22 rx=%2214%22 fill=%22%23D7262E%22/%3E%3Cpath d=%22M14 0H8V114H14A14 14 0 0 1 0 100V14A14 14 0 0 1 14 0Z%22 fill=%22%239E1B22%22/%3E%3Ccircle cx=%2228.0%22 cy=%2224.0%22 r=%2211.5%22 fill=%22%23FFFFFF%22/%3E%3Ccircle cx=%2228.0%22 cy=%2224.0%22 r=%227.82%22 fill=%22%233BA7F0%22/%3E%3Ccircle cx=%2225.12%22 cy=%2221.12%22 r=%222.07%22 fill=%22%23fff%22/%3E%3Crect x=%2243%22 y=%2210%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2268%22 y=%2210%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2218%22 y=%2243%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2243%22 y=%2243%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2268%22 y=%2243%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2218%22 y=%2276%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2243%22 y=%2276%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3Crect x=%2268%22 y=%2276%22 width=%2220%22 height=%2228%22 rx=%223.50%22 fill=%22%23FFFFFF%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#77756f;--line:#e6e3dc;
  --har:#1f9d55;--vag:#2f6fdf;--fra:#8a4fd8;--sak:#c9c6bf;--warn:#d98a10;
  --base:#c0392b;--rocket:#5b3fa0;--jungle:#2e8b57;--fossil:#8a6d3b;
}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f2f2f2;--mute:#9a9893;--line:#2c2c2c;--sak:#3a3a3a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
h1{font-size:17px;margin:0 0 8px;font-weight:800;letter-spacing:-.2px}
.prog{margin:10px 8px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px}
.prog h3{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.2px}
.prog table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.prog th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:700;text-align:right;padding:4px 4px;border-bottom:1.5px solid var(--ink)}
.prog th:first-child,.prog td:first-child{text-align:left}
.prog td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-weight:600}
.prog td:first-child{font-weight:800}
.prog tr.tot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:800}
.prog tr.sep td{border-bottom:0;padding:2px}
.prog .pc{font-weight:800}
.prog .mini{display:block;height:4px;background:var(--line);border-radius:3px;margin-top:3px;overflow:hidden}
.prog .mini i{display:block;height:100%;background:var(--har)}
.prog .vag{color:var(--vag);font-size:11px;font-weight:700}
.prog .foot{font-size:10.5px;color:var(--mute);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 7px}
.stat b{display:block;font-size:13.5px}
.stat span{font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--har)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
nav::-webkit-scrollbar{display:none}
nav a,.chip{flex:none;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
nav a.on,.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{font-size:12px;padding:5px 10px}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.chip.sw{border-style:dashed}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute);padding:8px 12px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
main{padding:8px 8px 60px}
.colhead{display:grid;grid-template-columns:66px repeat(var(--nc,4),1fr);gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);padding:4px 2px;position:sticky;top:var(--hh,150px);background:var(--bg);z-index:10}
.colhead div{text-align:center}.colhead div:first-child{text-align:left;padding-left:4px}.colhead div:nth-child(2){color:var(--base)}.colhead div:nth-child(3){color:var(--jungle)}.colhead div:nth-child(4){color:var(--fossil)}.colhead div:nth-child(5){color:var(--rocket)}
.row{display:grid;grid-template-columns:66px repeat(var(--nc,4),1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-bottom:6px;align-items:center}
.lab{padding-left:4px;min-width:0}
.lab .no{font-size:11px;color:var(--mute);font-weight:600}
.lab .nm{font-size:12px;font-weight:700;line-height:1.15;word-break:break-word}
.lab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.lab .oth{font-size:9.5px;color:var(--warn);margin-top:2px;line-height:1.2}
.cell{display:flex;gap:3px;justify-content:center;min-height:60px;align-items:center}
.cell.done .tc{opacity:.4}
.pm .tc.m img,.pm .tc.f img{filter:none;opacity:1}
.pm .tc.m,.pm .tc.f{outline:none}
.pm .tc.m .rkv,.pm .tc.f .rkv{color:var(--ink)}
.pm .cell.done .tc{opacity:.55}.pm .cell.done .tc img{filter:grayscale(1) brightness(.45)}
.cell.none{color:var(--line);font-size:18px}
.tc{position:relative;flex:1 1 0;max-width:58px;cursor:pointer;border-radius:5px}
.tc img{width:100%;display:block;border-radius:4px;aspect-ratio:200/279;object-fit:cover;background:var(--line)}
.tc.m img,.tc.f img{filter:grayscale(1);opacity:.3}
.tc.m,.tc.f{outline:1.5px dashed var(--sak);outline-offset:1px}
.tc .nr{position:absolute;left:2px;top:2px;background:rgba(0,0,0,.72);color:#fff;font-size:9px;font-weight:700;padding:1px 3px;border-radius:3px}
.tc .bd{position:absolute;right:2px;bottom:18px;font-size:8.5px;font-weight:800;color:#fff;padding:1px 3px;border-radius:3px}
.tc.h .bd{background:var(--har)}.tc.e1 .bd{background:var(--har)}.tc.v .bd{background:var(--vag)}.tc.f .bd{background:var(--fra)}
.tc .rkv{display:block;text-align:center;font-size:9.5px;font-weight:700;color:var(--ink);margin-top:2px;white-space:nowrap}.tc.m .rkv,.tc.f .rkv{color:var(--mute)}.tc .rk{position:absolute;left:0;right:0;bottom:-1px;text-align:center;font-size:9px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--card)}
.tc.m .rk{bottom:30%;font-size:10px}
.tc .pr{position:absolute;right:2px;top:2px;font-size:8.5px;font-weight:800;color:#fff;padding:1px 3px;border-radius:3px}
.p1{background:#1f9d55}.p2{background:#2e8b57}.p3{background:#2f6fdf}.p4{background:#e07b00}.p5{background:#7a7a7a}
.lst{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.lst h2{margin:0;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.lst h2 small{font-weight:600;color:var(--mute);font-size:11.5px}
.lst .why{font-size:11.5px;color:var(--mute);padding:6px 12px 2px}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .tc{max-width:40px}.li .tc .rkv,.li .tc .pr{display:none}
.li b{font-size:13.5px}.li small{display:block;color:var(--mute);font-size:11.5px}
.li .kr{font-weight:800;font-size:13.5px;text-align:right}.li .kr small{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px}
.gcard .tc{max-width:none}
.gcard .cap{font-size:11.5px;font-weight:600;margin-top:4px;line-height:1.2}
.gcard .cap small{display:block;color:var(--mute);font-weight:500}
h2{font-size:14px;margin:18px 4px 8px}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet img{width:62%;display:block;margin:0 auto 10px;border-radius:10px}
.sheet h3{margin:0;font-size:18px;text-align:center}
.sheet .sub{text-align:center;color:var(--mute);font-size:13px;margin:3px 0 12px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.btns button{font:600 12px Inter,sans-serif;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btns button.on{color:#fff;border-color:transparent}
.btns button[data-s=h].on{background:var(--har)}.btns button[data-s=v].on{background:var(--vag)}.btns button[data-s=f].on{background:var(--fra)}.btns button[data-s=m].on{background:#888}
.sheet a.tr{display:block;text-align:center;font-weight:700;font-size:14px;padding:11px;border-radius:12px;background:#ffd23f;color:#1d1d1f;text-decoration:none}
.sheet .close{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;color:var(--mute);font:600 14px Inter,sans-serif}
.note{font-size:11.5px;color:var(--mute);text-align:center;margin:6px 0 10px}
.lib-se{margin:14px 2px 6px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;justify-content:space-between}
.lib-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:6px;color:var(--ink);text-decoration:none}
.lib-row img{width:26px;height:26px;object-fit:contain}
.lib-row b{font-size:14px}.lib-row small{display:block;color:var(--mute);font-size:11.5px}
.lib-row .ct{text-align:right;font-weight:800;font-size:13px;min-width:70px}.lib-row .ct small{font-weight:600}
.lib-row .bar{margin-top:4px}
.wv{font-size:9.5px;font-weight:800;background:var(--vag);color:#fff;border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:1px}
.lc{position:relative;cursor:pointer}
.lc .ph{aspect-ratio:200/279;border-radius:5px;background:var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;color:var(--mute);padding:4px}
.lc img{width:100%;border-radius:5px;display:block;aspect-ratio:200/279;object-fit:cover}
.lc.no img{filter:grayscale(1);opacity:.3}
.lc .q{position:absolute;right:3px;top:3px;background:var(--har);color:#fff;font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px}

/* ===== Binderdex design 2 ===== */
:root{--bg:#f4f5f7;--bg2:#f4f5f7;--card:#fff;--ink:#14161a;--mute:#6b7280;--line:#e7e9ee;--sak:#d5d8de;--acc:#e3350d;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--bg2:#0f1115;--card:#181b21;--ink:#f3f4f6;--mute:#9aa3b2;--line:#262a33;--sak:#323743;--sh:0 1px 2px rgba(0,0,0,.4)}}
body{background:var(--bg);padding-bottom:calc(76px + env(safe-area-inset-bottom));letter-spacing:-.1px}
header{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand .logo{width:44px;height:44px}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}
.brand small{display:block;font-size:11.5px;color:var(--mute);font-weight:500;margin-top:-1px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:8px}
.seg a{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--mute);text-decoration:none;padding:7px 0;border-radius:9px}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chip{border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;border-radius:999px;padding:6px 12px}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.sw{border:0;box-shadow:inset 0 0 0 1px var(--line)}
.legend{font-size:10.5px;padding:8px 14px 0;gap:8px}
.prog{border:0;box-shadow:var(--sh);border-radius:18px;padding:14px;margin:12px 10px 0}
.prog h3{font-size:15px;letter-spacing:-.2px}
.prog .mini,.bar{height:6px;border-radius:6px}
.prog .mini i,.bar i{background:linear-gradient(90deg,#ff5a36,var(--acc))}
.prog th{border-bottom:1px solid var(--line)}
.prog tr.tot td{border-top:1px solid var(--line)}
main{padding:10px 10px 20px}
.row{border:0;box-shadow:var(--sh);border-radius:16px;padding:8px 6px;margin-bottom:8px}
.colhead{top:var(--hh,120px);background:color-mix(in srgb,var(--bg) 90%,transparent)}
.tc img{border-radius:6px}
.gcard{border:0;box-shadow:var(--sh);border-radius:14px;padding:6px}
.gcard .cap{font-size:12px;padding:2px 2px 1px}
.grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.lib-row{border:0;box-shadow:var(--sh);border-radius:16px;padding:12px 14px}
.lib-se{margin:18px 4px 8px;color:var(--mute);font-size:11.5px}
.lst{border:0;box-shadow:var(--sh);border-radius:18px}
.wv{background:var(--acc)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));margin:0;overflow:visible}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mute);text-decoration:none;background:none!important;border:0!important;padding:4px 0;border-radius:12px}
.tabbar svg{width:24px;height:24px;fill:currentColor;stroke:none}
.tabbar a:nth-child(4) svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar a:nth-child(4) svg circle{fill:currentColor}
.tabbar a.on{color:var(--acc)}
.sheet{border-radius:24px 24px 0 0}
.sheet a.tr{background:var(--acc);color:#fff;border-radius:14px}

/* Binderdex layout 3: Pokédex */
.brand{position:relative}
.tools{margin-left:auto;display:flex;gap:6px}
.ib{display:flex;align-items:center;gap:4px;height:34px;min-width:34px;padding:0 8px;border:0;border-radius:11px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:600 12px inherit;font-family:inherit;cursor:pointer;justify-content:center}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#colsw svg{fill:currentColor;stroke:none}
.ib .x{display:none}.ib#hidesw.on .x{display:inline}
.ib.on{background:var(--ink);color:var(--bg);box-shadow:none}
.frow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.frow::-webkit-scrollbar{display:none}
.frow .filters{display:contents}
.frow .filters.hide{display:none}
.vsep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.legend{display:none}.legend.show{display:flex}
.prog2{margin:12px 10px 0;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px}
.prog2 .hero{display:flex;align-items:center;justify-content:space-between}
.prog2 .hero small{display:block;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.prog2 .hero b{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums}
.prog2 .hero b span{font-size:16px;color:var(--mute);font-weight:700;letter-spacing:0}
.prog2 .hero em{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--vag)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.pt{display:block;text-decoration:none;color:var(--ink);background:var(--bg);border-radius:12px;padding:8px 7px;cursor:pointer}
.pt b{display:block;font-size:11px;font-weight:800;color:var(--c)}
.pt .pp{display:block;font-size:17px;font-weight:800;letter-spacing:-.4px;margin:1px 0 4px}
.pt .bar{display:block;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.pt .bar i{display:block;height:100%;background:var(--c)}
.pt small{display:block;font-size:10.5px;color:var(--mute);font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.pt small em{font-style:normal;color:var(--vag);font-weight:700}
.prog2 .sum{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute);margin-top:10px;flex-wrap:wrap}
.prog2 .sum b{color:var(--ink)}
.colhead,.row{grid-template-columns:repeat(var(--nc,4),1fr)}
.colhead div:first-child{text-align:center;padding-left:0}
.row{padding:8px 6px 6px;align-items:start}
.lab{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 4px 4px;min-width:0}
.lab .dot{margin:0;flex:none}
.lab .no{font-size:11px}
.lab .nm{font-size:13.5px;font-weight:800;word-break:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .oth{margin:0 0 0 auto;font-size:10.5px;white-space:nowrap}
.cell{min-height:0}
.cell.none{min-height:40px;opacity:.6}
.tc{max-width:54px}

/* Lugnare kort: nummer och pris bara där de behövs */
.tc.h .nr,.tc.e1 .nr,.tc.v .nr{display:none}
.tc.h .rkv,.tc.e1 .rkv,.tc.v .rkv{display:none}
.tc:hover .nr{display:block}
.cell.none{font-size:14px;opacity:.35}
.colhead.c2{display:none}
/* Desktop: sidomeny + bredare innehåll */
@media (min-width:960px){
  :root{--sb:248px}
  body{padding-bottom:0}
  header{position:fixed;top:0;left:0;bottom:0;width:var(--sb);box-sizing:border-box;overflow-y:auto;border-bottom:0;border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:4px;background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
  .brand{flex-wrap:wrap;margin-bottom:10px}
  .brand .logo{width:48px;height:48px}
  .tools{order:3;width:100%;margin:10px 0 0;justify-content:flex-start}
  header .tabbar{position:static;flex-direction:column;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;box-shadow:none;padding:0;margin:4px 0 14px;gap:2px}
  header .tabbar a{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:9px 12px;border-radius:10px!important;color:var(--ink)}
  header .tabbar a.on{background:color-mix(in srgb,var(--acc) 10%,transparent)!important;color:var(--acc)}
  header .tabbar svg{width:20px;height:20px}
  .frow{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .vsep{display:none}
  #pfilters{display:contents}
  .seg{flex-direction:column}
  .seg a{text-align:left;padding:8px 12px}
  .legend{padding:10px 0 0;flex-direction:column;gap:6px}
  .legend.show{display:flex}
  #prog,.legend+section,main{margin-left:var(--sb)}
  #prog{max-width:1240px;padding:18px 24px 0;box-sizing:border-box}
  .prog2{margin:0;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:18px 22px}
  .prog2 .hero{gap:18px;justify-content:flex-start}
  .prog2 .tiles{margin:0}
  .prog2 .sum{grid-column:1/-1;margin:0}
  main{max-width:1240px;padding:16px 24px 40px;box-sizing:border-box}
  .colhead{top:0}
  .tc{max-width:58px}
  .dexgrid{display:block}
  .colhead,.row{grid-template-columns:200px repeat(var(--nc,4),1fr)}
  .colhead::before{content:"";}
  .row{align-items:center;padding:6px 10px;margin-bottom:4px}
  .lab{grid-column:auto;padding:0 0 0 6px;flex-wrap:wrap;row-gap:2px}
  .lab .oth{margin:0;flex-basis:100%;padding-left:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .lib-wrap,.libgrid{max-width:none}
  #modal .sheet{max-width:440px;margin:0 auto}
}

/* ===== Binderdex brand: neutralt + en accent. Korten står för färgen. ===== */
:root{--bg:#F6F6F7;--bg2:#F6F6F7;--card:#FFFFFF;--ink:#0F1115;--ink2:#3A3F4A;--mute:#6B7280;--line:#E8E9EC;--sak:#D4D7DD;
  --acc:#D7262E;--acc-soft:#FCEBEC;--har:#16A34A;--vag:#2563EB;--fra:#9CA3AF;--warn:#6B7280;
  --base:var(--mute);--jungle:var(--mute);--fossil:var(--mute);--rocket:var(--mute);
  --r:14px;--sh:0 1px 2px rgba(15,17,21,.04),0 0 0 1px rgba(15,17,21,.05);--sh2:0 8px 24px rgba(15,17,21,.10),0 0 0 1px rgba(15,17,21,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0E0F12;--bg2:#0E0F12;--card:#16181D;--ink:#F3F4F6;--ink2:#C9CDD4;--mute:#8B93A1;--line:#24272E;--sak:#30343C;--acc-soft:#3A1416;--sh:0 0 0 1px rgba(255,255,255,.06);--sh2:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-.01em}
.chip{font-weight:600;font-size:12.5px;padding:6px 12px;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--card)}
.pdot{display:none}
.chip[data-p="1"]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px}
/* Rubrik + KPI */
.shead{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.shead img{width:36px;height:36px;object-fit:contain}
.shead small{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.shead h1{margin:2px 0 0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.kpi b em{font-style:normal;font-size:14px;color:var(--mute);font-weight:700;letter-spacing:0}
.kpi span{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.kpi.acc b{color:var(--acc)}
details.more{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:0 16px;margin-bottom:16px}
details.more summary{cursor:pointer;font-size:13px;font-weight:700;padding:12px 0;color:var(--ink2);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"＋";float:right;color:var(--mute)}
details.more[open] summary::after{content:"－"}
details.more p{font-size:13.5px;line-height:1.55;color:var(--ink2);margin:0 0 12px;max-width:70ch}
details.more dl{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;font-size:13px;margin:0 0 16px}
details.more dt{color:var(--mute)}details.more dd{margin:0;font-weight:600}
details.more a,.lnote a{color:var(--ink);text-underline-offset:2px}
.flab{font-size:12px;color:var(--mute);align-self:center;margin-right:4px;font-weight:600}
.lnote{font-size:12.5px;color:var(--mute);margin:0 0 16px}
/* Progress (Pokédex) */
.prog2{box-shadow:var(--sh);border-radius:18px}
.pt{background:var(--bg);transition:background .15s}
.pt:hover{background:var(--line)}
.pt b{color:var(--ink2)}
.pt .bar i,.bar i,.prog .mini i{background:var(--ink)!important}
.prog2 .hero em,.pt small em{color:var(--vag)}
.ring{background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
/* Rader och kort */
.row,.gcard,.lib-row{box-shadow:var(--sh);border:0}
.colhead{color:var(--mute);font-size:11px;letter-spacing:.08em}
.colhead div{color:var(--mute)!important}
.lab .oth{color:var(--mute);font-weight:500}
.tc{transition:transform .15s ease}
.tc:hover{transform:translateY(-2px)}
.tc img{box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tc .pr{background:var(--ink2)!important;color:#fff}
.tc .pr.p1{background:var(--acc)!important}
.tc .nr{background:rgba(15,17,21,.75)}
.gcard{transition:box-shadow .15s,transform .15s}
.gcard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.gcard .cap small{color:var(--mute)}
.wv{background:none;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;letter-spacing:.04em}
.lc .q{background:var(--ink)}
/* Samling */
.libgrid{display:grid;grid-template-columns:1fr;gap:8px}
.libgrid .lib-row{margin:0;transition:box-shadow .15s,transform .15s}
.libgrid .lib-row:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.lib-se{letter-spacing:.08em}
/* Köpa */
.lst{background:none;border:0;box-shadow:none;margin:0 0 24px;padding:0}
.lhd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lhd>div{flex:1}.lhd b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.lhd small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.lhd .lsum{text-align:right;font-size:12px;color:var(--mute)}.lhd .lsum b{font-size:15px;color:var(--ink)}
.pt-badge{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--card);font-weight:800;font-size:14px;flex:none}
.pt-badge.p1{background:var(--acc);color:#fff}
.pt-badge.p4,.pt-badge.p5{background:var(--line);color:var(--ink2)}
.litems{display:grid;grid-template-columns:1fr;gap:8px}
.li{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:0;padding:10px 14px;grid-template-columns:48px 1fr auto;gap:14px}
.li .tc{max-width:48px}
.lmid b{display:block;font-size:14.5px;font-weight:700}
.lmid small{display:block;font-size:12px;color:var(--mute);margin:1px 0 6px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ink2);background:var(--bg);border-radius:6px;padding:2px 7px}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.li .kr{text-align:right}.li .kr b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em}
.li .kr small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.trb{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.trb:hover{background:var(--bg)}
.sheet a.tr{background:var(--ink);color:var(--card)}
.btns button[data-s=m].on{background:var(--ink2)}
@media (max-width:959px){.kpis{grid-template-columns:repeat(3,1fr);gap:6px}.kpi{padding:10px 12px}.kpi b{font-size:17px}.kpi small,.kpi span{font-size:11px}.shead h1{font-size:24px}.shead{margin-bottom:12px}}
@media (min-width:960px){
  header{background:var(--card)}
  .libgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .litems{grid-template-columns:1fr 1fr}
  .shead h1{font-size:32px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
}

/* Scanner – iPhone först */
.tabbar a[data-v=scan] svg,.tabbar a[data-v=lista] svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tabbar a[data-v=lista] svg circle{fill:currentColor}
body.scanmode header,body.scanmode #prog,body.scanmode .legend{display:none}
body.scanmode main{padding:0;max-width:none}
body.scanmode{background:#000}
.scan{position:relative}
.cam{position:relative;background:#000;overflow:hidden;height:calc(100dvh - 64px - env(safe-area-inset-bottom))}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;inset:0 0 120px;display:grid;place-items:center;pointer-events:none}
.guide i{display:block;height:74%;max-width:84%;aspect-ratio:63/88;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.42);outline:3px solid rgba(255,255,255,.95)}
.scx{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top));width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:24px;line-height:36px;text-align:center;text-decoration:none;backdrop-filter:blur(10px)}
.traybtn{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));border:0;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font:600 13px inherit;font-family:inherit;padding:9px 14px;backdrop-filter:blur(10px)}
.traybtn b{font-weight:800}
.pill{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:999px;backdrop-filter:blur(10px);white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--har)}.pill.hide{display:none}
.camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff;padding:24px;background:#000;z-index:2}
.camoff span{font-size:14px;color:#b9bec8;max-width:260px}.camoff.hide{display:none}
.trb.big{font-size:16px;padding:12px 22px;background:#fff;color:#0f1115;margin-top:10px;cursor:pointer;border-radius:999px}
.scbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 12px 14px;z-index:3}
.rb{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer;color:#fff}
.rb svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linejoin:round}
.rb.busy{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
.schit{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 12px 8px 8px;min-height:64px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:up .25s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.schit img{width:44px;border-radius:4px;flex:none}
.schit .hm{flex:1;min-width:0}
.schit small{display:block;font-size:11.5px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schit b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schit .val{flex:none;font-size:17px;font-weight:800;color:var(--acc)}
.schit.empty{justify-content:center;color:var(--mute);font-size:13.5px;background:rgba(255,255,255,.92);animation:none}
.alts{display:flex;gap:4px;margin-top:3px;overflow-x:auto;scrollbar-width:none}
.alts button{flex:none;font:600 11px inherit;font-family:inherit;border:0;border-radius:999px;padding:3px 8px;background:var(--bg);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:75dvh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.tray.open{transform:none}
.trayhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.trayhd b{font-size:17px}
.trayhd button{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--mute)}
.ti{display:grid;grid-template-columns:36px 1fr auto auto 28px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ti img{width:36px;border-radius:3px}.ti b{display:block;font-size:14px}.ti small{font-size:12px;color:var(--mute)}
.ti .q{font-size:12px;font-weight:700;color:var(--mute)}.ti .r{font-size:14px;font-weight:700}
.ti button{border:0;background:none;color:var(--mute);font-size:20px}
.savebtn{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;font:700 15px inherit;font-family:inherit;background:var(--acc);color:#fff}
.savebtn:disabled{opacity:.35}

.schit .val{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wrong{border:0;background:none;color:var(--mute);font:600 11px inherit;font-family:inherit;padding:0;text-decoration:underline;text-underline-offset:2px}
.schit.pick3{gap:6px;padding:6px}
.pick3 button,.pk3 button{flex:1;min-width:0;border:0;background:var(--bg);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit;cursor:pointer}
.pick3 img{width:34px;border-radius:3px}.pick3 span,.pk3 span{font-size:11px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick3 small,.pk3 small{font-size:9.5px;color:var(--mute);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick3 .more{flex:none;width:52px;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2)}
.pk3{display:flex;gap:8px;margin:6px 0 12px}.pk3 button{padding:8px}.pk3 img{width:64px;border-radius:4px}
#pq{width:100%;box-sizing:border-box;border:0;border-radius:12px;background:var(--bg);padding:12px 14px;font:500 16px inherit;font-family:inherit;color:var(--ink);outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.pr2{width:100%;display:grid;grid-template-columns:1fr auto;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:10px 2px;font-family:inherit;color:var(--ink)}
.pr2 b{font-size:14px}.pr2 small{grid-row:2;font-size:12px;color:var(--mute)}.pr2 span{grid-row:1/3;grid-column:2;align-self:center;font-weight:700;font-size:13px}
.skip{width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;font:700 14px inherit;font-family:inherit;background:var(--bg);color:var(--ink2)}
#pick{z-index:61}
.deck{position:absolute;left:0;right:0;bottom:88px;display:flex;gap:8px;overflow-x:auto;padding:0 12px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;z-index:3;opacity:0;pointer-events:none;transition:opacity .2s}
.deck.on{opacity:1;pointer-events:auto}.deck::-webkit-scrollbar{display:none}
.dc{flex:none;position:relative;width:58px;scroll-snap-align:start;text-align:center;cursor:pointer;animation:up .25s ease}
.dc img{width:58px;border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.4);display:block}
.dc small{display:block;font-size:11px;font-weight:800;color:#fff;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dc i{position:absolute;right:-4px;top:-4px;background:var(--acc);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}
.dc .ph2{display:grid;place-items:center;width:58px;height:81px;border-radius:5px;background:#333;color:#fff;font-size:9px;padding:3px;box-sizing:border-box}
.dc.save{height:81px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:800 12px inherit;font-family:inherit;line-height:1.3}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.cand{flex:none;width:128px;scroll-snap-align:start;border:0;background:var(--bg);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;color:var(--ink);text-align:center}
.cand .ci{display:block;width:112px;aspect-ratio:63/88;border-radius:6px;background:var(--line);overflow:hidden}
.cand .ci img{width:100%;height:100%;object-fit:cover;display:block}
.cand b{font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand small{font-size:11px;color:var(--mute);line-height:1.25}
.cand em{font-style:normal;font-size:12.5px;font-weight:800;color:var(--acc)}
.cand.last{justify-content:center;gap:10px;min-height:220px}
.cand .lb{width:100%;border:0;border-radius:10px;padding:11px;font:700 14px inherit;font-family:inherit;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.psearch.hide{display:none}
.vt{display:inline-block;vertical-align:2px;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--ink);border-radius:4px;padding:1px 5px;margin-left:2px}
.cand .vt{margin:0}

/* Scanner v3 */
.tools2{position:absolute;right:14px;top:calc(58px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;z-index:3}
.tb{display:flex;align-items:center;gap:6px;justify-content:center;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(10px);font:700 12px inherit;font-family:inherit}

.tb.on{background:#fff;color:#000}.tb.on svg{stroke:#000}
.tb.hide{display:none}
#sndbtn .x{display:none}#sndbtn.off .x{display:inline}#sndbtn.off .w{display:none}
.rb{flex-direction:column;gap:0;width:54px;height:54px}.rb span{font-size:9.5px;font-weight:700;color:#fff;margin-top:1px}
.rb svg{width:20px;height:20px}
.guide i{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.guide i b{display:none;border:1px dashed rgba(255,255,255,.45);margin:2px;border-radius:6px;transition:background .2s}
.pagemode .guide i{height:80%;max-width:94%}

.guide i b.near{background:rgba(255,255,255,.12);border-style:solid}
.guide i b.bad{background:rgba(215,38,46,.22)}
.pageadd{position:absolute;left:50%;transform:translateX(-50%);bottom:170px;border:0;border-radius:999px;background:var(--har);color:#fff;font:800 15px inherit;font-family:inherit;padding:12px 22px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:4}

</style>

28" rx="3.50" fill="#FFFFFF"/></g></svg><div><b>Binderdex</b><small>Din Pokémon-samling</small></div><div class="tools"><button class="ib" id="hidesw" title="Dölj klara rader"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="x" d="M4 4l16 16"/></svg></button><button class="ib" id="colsw" title="Kolumner: set eller prio"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="4" height="16" rx="1.5"/><rect x="10" y="4" width="4" height="16" rx="1.5"/><rect x="17" y="4" width="4" height="16" rx="1.5"/></svg><span id="colsw_t">Set</span></button><button class="ib" id="infobtn" title="Förklaring"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button></div></div>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const SETS={base:{code:'base1',name:'Base Set',tot:102},jungle:{code:'base2',name:'Jungle',tot:64},fossil:{code:'base3',name:'Fossil',tot:62},rocket:{code:'base5',name:'Team Rocket',tot:82}};
const STL={h:'Har',e1:'Har (1st Ed)',v:'På väg',f:'Förfrågan',m:'Saknas'};
const BD={h:'✓',e1:'1st',v:'VÄG',f:'?'};
let DATA,OV={};
try{OV=JSON.parse(localStorage.getItem('pk151ov')||'{}')}catch(e){OV={}}
const key=c=>c.s+'-'+c.n;
const st=c=>OV[key(c)]||c.st;
const has=c=>['h','e1'].includes(st(c));
let filter='all',pf=0,colmode='set',hideDone=false;
const PCOLS=[['P1',c=>pr(c)===1,'var(--acc)'],['P2',c=>pr(c)===2,'var(--mute)'],['P3',c=>pr(c)===3,'var(--mute)'],['P4',c=>pr(c)===4,'var(--mute)'],['P5',c=>pr(c)===5,'var(--mute)'],['Klar',c=>!pr(c),'var(--mute)']];
const pr=c=>(has(c)||st(c)==='v')?0:P[key(c)];
const pp=c=>!pf||pr(c)===pf;

function thumb(c,big){
  const s=st(c),cls=(s==='e1'?'e1':s);
  return `<div class="tc ${cls}" data-k="${key(c)}">
    <img loading="lazy" src="img/${SETS[c.s].code}-${c.n}.webp" alt="${c.nm} ${c.n}/${SETS[c.s].tot}">
    <span class="nr">${c.n}</span>${P[key(c)]&&!has(c)&&st(c)!=='v'?`<span class="pr p${P[key(c)]}">P${P[key(c)]}</span>`:''}
    ${(s!=='m'&&s!=='f')?`<span class="bd">${BD[s]}</span>`:''}
    <span class="rkv">${c.r} kr</span>
  </div>`;
}


const ORD=['base','jungle','fossil','rocket'];
const TIERS={1:['Köp direkt','Billigt och viktigt. Ta dem när de dyker upp.'],2:['Billigt','Bra att ta med i samfrakt.'],3:['Mellanpris','Köp när priset ligger på eller under riktpris. Hit hör Gengar och Venusaur.'],4:['Dyrt','De riktigt dyra Base-, Jungle- och Fossil-korten. Vänta på fynd.'],5:['Team Rocket','Rocket-setet görs sist, när allt annat är klart.']};
const WHY={3:['Saknas i Gen 1','#d23b3b'],2:['Ersätter platshållare','#e07b00'],1:['Fyller set','#2e8b57'],0.5:['Rocket-set','#5b3fa0']};
const TOO=100;
const mx=c=>Math.max(Math.round(c.r*1.3),10);
let P={},W={},E={};
function prio(){
  P={};W={};E={};
  const owned=c=>has(c)||st(c)==='v';
  for(const d of DATA.dex){
    const cs=DATA.cards.filter(c=>c.d===d.d);
    if(cs.some(c=>c.s!=='rocket'&&owned(c)))continue;
    const cands=cs.filter(c=>c.s!=='rocket'&&!owned(c));
    let t=null;
    for(const s of ['base','jungle','fossil']){
      const o=cands.filter(c=>c.s===s).sort((a,b)=>a.r-b.r);
      if(!o.length)continue;
      const ch=o[0];
      const cheaperLater=cands.some(c=>ORD.indexOf(c.s)>ORD.indexOf(s)&&c.r<ch.r*0.5);
      if(ch.r<=TOO||!cheaperLater){t=ch;break}
    }
    if(!t)continue;
    W[key(t)]=(!cs.some(owned)&&!d.o.length)?3:2;
  }
  for(const c of DATA.cards){
    if(owned(c))continue;
    const k=key(c),w=W[k]||(c.s==='rocket'?0.5:1);W[k]=w;
    const e=Math.max(c.r,5)/w;E[k]=e;
    P[k]=c.s==='rocket'?5:e<=15?1:e<=40?2:e<=250?3:4;
  }
}
const kr=n=>'~'+Math.round(n).toLocaleString('sv-SE')+' kr';
function kpis(a){return `<div class="kpis">${a.map(([l,v,s,acc])=>`<div class="kpi${acc?' acc':''}"><small>${l}</small><b>${v}</b>${s?`<span>${s}</span>`:''}</div>`).join('')}</div>`}
function renderTrade(){
  let T=[];try{T=JSON.parse(localStorage.getItem('bdx_trade')||'[]')}catch(e){}
  const sum=T.reduce((a,t)=>a+(t.r||0),0);
  return `<div class="shead"><div><small>Dubbletter att byta bort</small><h1>Byten</h1></div></div>
  <div class="filters" style="margin-bottom:12px"><a class="chip" href="#lista">Att köpa</a><a class="chip on" href="#byten">Byteshög</a></div>
  ${kpis([['Kort i högen',T.length,''],['Bytesvärde',kr(sum),'riktpris',1]])}
  ${T.length?`<div class="litems">${T.map((t,i)=>`<div class="li"><div class="tc h"><img loading="lazy" data-tid="${t.id}" alt=""></div><div class="lmid"><b>${t.nm}</b><small>${t.set} ${t.n}${t.ed?' · 1st Ed':''} · ${t.cond}</small></div><div class="kr"><b>${t.r!=null?t.r+' kr':'–'}</b><button class="trb" data-trm="${i}">Ta bort</button></div></div>`).join('')}</div>`:'<div class="lnote">Högen är tom. Dubbletter du skannar hamnar här när du sparar.</div>'}`;
}
function renderList(){
  const items=DATA.cards.filter(c=>P[key(c)]&&!has(c)&&st(c)!=='v');
  let h='';
  for(const t of [1,2,3,4,5]){
    if(pf&&t!==pf)continue;
    const L=items.filter(c=>P[key(c)]===t).sort((a,b)=>(E[key(a)]-E[key(b)])||(ORD.indexOf(a.s)-ORD.indexOf(b.s)));
    if(!L.length)continue;
    const sum=L.reduce((a,c)=>a+c.r,0);
    h+=`<section class="lst"><div class="lhd"><span class="pt-badge p${t}">P${t}</span><div><b>${TIERS[t][0]}</b><small>${TIERS[t][1]}</small></div><span class="lsum">${L.length} kort<br><b>${kr(sum)}</b></span></div><div class="litems">`;
    for(const c of L){
      const q=encodeURIComponent(`${c.nm.replace(/ [♂♀]/,'')} ${c.n}/${SETS[c.s].tot}`);
      h+=`<div class="li">${thumb(c)}<div class="lmid"><b>${c.nm}</b><small>${SETS[c.s].name.replace('Team ','')} ${c.n}/${SETS[c.s].tot}</small><span class="tag${W[key(c)]===3?' acc':''}">${WHY[W[key(c)]][0]}</span></div><div class="kr"><b>${mx(c)} kr</b><small>max · rikt ${c.r}</small><a class="trb" href="https://www.tradera.com/search?q=${q}" target="_blank" rel="noopener">Tradera ↗</a></div></div>`;
    }
    h+='</div></section>';
  }
  const all=items.filter(c=>!pf||P[key(c)]===pf),p1=items.filter(c=>P[key(c)]===1);
  return `<div class="shead"><div><small>Inköpslista</small><h1>Köpa</h1></div></div>
  <div class="filters" style="margin-bottom:12px"><a class="chip on" href="#lista">Att köpa</a><a class="chip" href="#byten">Byteshög</a></div>
  ${kpis([['Kort att köpa',all.length,pf?`P${pf}`:'alla prio'],['P1 köp direkt',p1.length,kr(p1.reduce((a,c)=>a+c.r,0)),1],['Riktpris totalt',kr(all.reduce((a,c)=>a+c.r,0)),'']])}
  <div class="lnote">Max = riktpris + 30 %, minst 10 kr. Klicka på ett kort för att ändra status.</div>`+h;
}

function stats(){
  const C=s=>DATA.cards.filter(c=>c.s===s);
  const pc=x=>Math.round(x*100);
  const g1=DATA.dex.filter(d=>d.o.length||DATA.cards.some(c=>c.d===d.d&&has(c))).length;
  const g1v=DATA.dex.filter(d=>!d.o.length&&!DATA.cards.some(c=>c.d===d.d&&has(c))&&DATA.cards.some(c=>c.d===d.d&&st(c)==='v')).length;
  const val=DATA.cards.filter(has).reduce((a,c)=>a+c.r,0);
  const bjf=DATA.cards.filter(c=>c.s!=='rocket'),bh=bjf.filter(has).length;
  const tile=s=>{const cs=C(s),hv=cs.filter(has).length,v=cs.filter(c=>st(c)==='v').length,t=SETS[s].tot,p=hv/t;
    return `<a class="pt" data-go="${s}"><b>${s==='base'?'Base':SETS[s].name.replace('Team ','')}</b><span class="pp">${pc(p)}%</span><span class="bar"><i style="width:${p*100}%"></i></span><small>${hv}/${t}${v?` <em>+${v}</em>`:''}</small></a>`};
  document.getElementById('prog').innerHTML=`<div class="prog2">
    <div class="hero"><div><small>Gen 1 · arter</small><b>${g1}<span>/151</span></b>${g1v?`<em>+${g1v} på väg</em>`:''}</div>
      <div class="ring" style="--p:${g1/151*100}"><span>${pc(g1/151)}%</span></div></div>
    <div class="tiles">${ORD.map(tile).join('')}</div>
    <div class="sum"><span>Base + Jungle + Fossil <b>${bh}/${bjf.length}</b></span><span>Värde <b>~${val.toLocaleString('sv-SE')} kr</b></span></div>
  </div>`;
}

function pass(c){
  if(!pp(c))return false;
  const s=st(c);
  if(filter==='miss')return s==='m';
  if(filter==='incoming')return s==='v'||s==='f';
  return true;
}

function renderDex(){
  const cols=colmode==='prio'?PCOLS:Object.keys(SETS).map(s=>[s==='base'?'Base':SETS[s].name.replace('Team ',''),c=>c.s===s,`var(--${s})`]);
  document.getElementById('main').style.setProperty('--nc',cols.length);
  let hidden=0;
  const ch=`${cols.map(c=>`<div style="color:${c[2]}">${c[0]}</div>`).join('')}`;
  let h=`<div class="dexgrid"><div class="colhead">${ch}</div><div class="colhead c2">${ch}</div>`;
  for(const d of DATA.dex){
    const cs=DATA.cards.filter(c=>c.d===d.d);
    const anyHave=cs.some(has), anyComing=cs.some(c=>st(c)==='v');
    const dot=anyHave?'var(--har)':anyComing?'var(--vag)':d.o.length?'var(--sak)':'var(--acc)';
    if(filter==='nogen1'&&(anyHave||d.o.length||cs.some(c=>st(c)==='v')))continue;
    if((filter==='miss'||filter==='incoming'||pf)&&!cs.some(pass))continue;
    if(hideDone&&cs.length&&cs.every(c=>has(c)||st(c)==='v')){hidden++;continue;}
    h+=`<div class="row"><div class="lab"><span class="dot" style="background:${dot}"></span><span class="no">#${String(d.d).padStart(3,'0')}</span><span class="nm">${d.nm}</span>${!anyHave&&d.o.length?`<span class="oth">Har i: ${d.o.slice(0,2).join(', ')}</span>`:''}</div>`;
    for(const col of cols){
      const sc=cs.filter(c=>col[1](c)&&(!pf||pass(c))).sort((a,b)=>ORD.indexOf(a.s)-ORD.indexOf(b.s)||a.n-b.n);
      h+=sc.length?`<div class="cell${colmode==='prio'&&col[0]==='Klar'?' done':''}">${sc.map(c=>thumb(c)).join('')}</div>`:'<div class="cell none">–</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  if(hidden)h+=`<div class="note">${hidden} klara rader är dolda.</div>`;
  h+='<h2>Trainers & energi</h2>';
  for(const s in SETS){
    const ts=DATA.cards.filter(c=>c.s===s&&c.t&&pass(c));
    if(!ts.length)continue;
    h+=`<h2 style="color:var(--${s});font-size:13px">${SETS[s].name}</h2><div class="grid">${ts.map(gcard).join('')}</div>`;
  }
  return h;
}
function gcard(c){return `<div class="gcard">${thumb(c)}<div class="cap">${c.nm}<small>${c.n}/${SETS[c.s].tot} · ${STL[st(c)]}${pr(c)?` · P${pr(c)}`:''}</small></div></div>`}
const SINFO={
 base:{ps:'base',bp:'Base_Set_(TCG)',rel:'9 januari 1999',yr:1999,sym:'Ingen symbol',holo:16,txt:'Det första engelska setet från Wizards of the Coast. Innehåller startarna, Charizard, Blastoise och Venusaur som holo. Finns i 1st Edition, Shadowless och Unlimited.'},
 jungle:{ps:'jungle',bp:'Jungle_(TCG)',rel:'16 juni 1999',yr:1999,sym:'Blomma',holo:16,txt:'Andra setet. De flesta holo-Pokémon finns även som non-holo, så setet har 64 kort men bara 48 olika Pokémon och trainers.'},
 fossil:{ps:'fossil',bp:'Fossil_(TCG)',rel:'10 oktober 1999',yr:1999,sym:'Fossil/klo',holo:15,txt:'Tredje setet med fossil-Pokémon och de legendariska fåglarna. Holo-korten finns även som non-holo.'},
 rocket:{ps:'team-rocket',bp:'Team_Rocket_(TCG)',rel:'24 april 2000',yr:2000,sym:'R',holo:17,txt:'Första setet med Dark Pokémon. 82 kort plus det hemliga kortet Dark Raichu (83/82).'}
};
let sortBy='nr';
const SORTS=[['nr','Nummer'],['dyr','Dyrast'],['bill','Billigast'],['namn','Namn'],['saknas','Saknas först'],['prio','Prio']];
function renderSet(s){
  const all=DATA.cards.filter(c=>c.s===s);
  const cs=all.filter(pass);
  const f={nr:(a,b)=>a.n-b.n,dyr:(a,b)=>b.r-a.r,bill:(a,b)=>a.r-b.r,namn:(a,b)=>a.nm.localeCompare(b.nm,'sv'),
    saknas:(a,b)=>(has(a)-has(b))||a.n-b.n,prio:(a,b)=>((pr(a)||9)-(pr(b)||9))||(E[key(a)]||0)-(E[key(b)]||0)||a.n-b.n}[sortBy];
  cs.sort(f);
  const I=SINFO[s],h=all.filter(has).length,v=all.filter(c=>st(c)==='v').length;
  const tot=all.reduce((a,c)=>a+c.r,0),own=all.filter(has).reduce((a,c)=>a+c.r,0),miss=all.filter(c=>!has(c)&&st(c)!=='v').reduce((a,c)=>a+c.r,0);
  const top=[...all].sort((a,b)=>b.r-a.r).slice(0,3);
  return `<div class="shead"><div><small>${I.yr} · ${SETS[s].tot}${s==='rocket'?'+1':''} kort · ${I.holo} holo</small><h1>${SETS[s].name}</h1></div></div>
    ${kpis([['Du har',`${h}<em>/${all.length}</em>`,`${Math.round(h/all.length*100)} %${v?` · +${v} på väg`:''}`,1],['Ditt värde',kr(own),''],['Kvar att köpa',kr(miss),`${all.length-h-v} kort`],['Hela setet',kr(tot),'']])}
    <details class="more"><summary>Mer om setet</summary><p>${I.txt}</p><dl><dt>Släppt</dt><dd>${I.rel}</dd><dt>Setsymbol</dt><dd>${I.sym}</dd><dt>Dyrast</dt><dd>${top.map(c=>`${c.nm} ${c.r.toLocaleString('sv-SE')} kr`).join(' · ')}</dd><dt>Läs mer</dt><dd><a href="https://pokesymbols.com/tcg/sets/${I.ps}" target="_blank" rel="noopener">PokeSymbols</a> · <a href="https://bulbapedia.bulbagarden.net/wiki/${I.bp}" target="_blank" rel="noopener">Bulbapedia</a></dd></dl></details>
    <div class="filters" id="sorts" style="margin-bottom:10px"><span class="flab">Sortera</span>${SORTS.map(([k,l])=>`<span class="chip${sortBy===k?' on':''}" data-sort="${k}">${l}</span>`).join('')}</div>
    <div class="grid">${cs.map(gcard).join('')}</div>`;
}


let DB=null,SIMG={},OIMG=null,libSort='nr',libOnlyMine=true;
const SETMAP={base1:'base',base2:'jungle',base3:'fossil',base5:'rocket'};
const SEN={'Base':'Wizards of the Coast · Base','Gym':'Wizards of the Coast · Gym','Neo':'Wizards of the Coast · Neo','Other':'Övrigt','E-Card':'e-Card','EX':'EX','NP':'Nintendo-promos','POP':'POP','Diamond & Pearl':'Diamond & Pearl','Platinum':'Platinum','HeartGold & SoulSilver':'HeartGold & SoulSilver','Black & White':'Black & White','XY':'XY','Sun & Moon':'Sun & Moon','Sword & Shield':'Sword & Shield','Scarlet & Violet':'Scarlet & Violet','Mega Evolution':'Mega Evolution'};
function ownOf(sid){
  if(SETMAP[sid]){return DATA.cards.filter(c=>c.s===SETMAP[sid]&&has(c)).map(c=>({n:String(c.n),nm:c.nm,q:1,r:c.r}));}
  const L=DB.own.filter(o=>o.s===sid).map(o=>Object.assign({},o));
  try{for(const id in EXTRA){if(id.startsWith(sid+'-')){const n=id.slice(sid.length+1),e=L.find(o=>o.n===n);if(e)e.q+=EXTRA[id];else{const c=(DB.cards[sid]||[]).find(c=>c[0]===n);L.push({s:sid,n,nm:c?c[1]:n,ra:c?c[2]:'',q:EXTRA[id],r:0})}}}}catch(e){}
  return L;
}
function setStat(x){
  const o=ownOf(x.id);const u=new Set(o.map(c=>c.n)).size;
  return {u,q:o.reduce((a,c)=>a+c.q,0),val:o.reduce((a,c)=>a+c.r*c.q,0)};
}
function renderLib(v){
  prio();
  ['prog','filters','pfilters'].forEach(i=>document.getElementById(i).classList.add('hide'));document.querySelector('.legend').classList.add('hide');document.getElementById('setseg').classList.add('hide');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==='samling'));
  const m=document.getElementById('main');m.classList.remove('pm');
  if(v.startsWith('set-')){m.innerHTML=libSet(v.slice(4));if(v.slice(4) in SETMAP)return;loadImgs(v.slice(4));return;}
  const st=DB.sets.map(x=>({x,s:setStat(x)}));
  const tot=st.reduce((a,b)=>a+b.s.q,0),uniq=st.reduce((a,b)=>a+b.s.u,0),ns=st.filter(a=>a.s.q).length,val=st.reduce((a,b)=>a+b.s.val,0);
  let h=`<div class="shead"><div><small>Alla serier och set</small><h1>Samlingen</h1></div></div>
   ${kpis([['Kort totalt',tot.toLocaleString('sv-SE'),`${uniq} unika`],['Set med kort',`${ns}<em>/${DB.sets.length-2}</em>`,''],['Värde',kr(val),'riktpris',1]])}
   <div class="filters" style="margin:8px 0"><span class="chip${libOnlyMine?' on':''}" data-lib="mine">Bara set jag har kort i</span><span class="chip${!libOnlyMine?' on':''}" data-lib="all">Alla ${DB.sets.length-2} set</span></div>`;
  for(const se of DB.series){
    const rows=st.filter(a=>a.x.se===se&&(!libOnlyMine||a.s.q||a.x.w));
    if(!rows.length)continue;
    h+=`<div class="lib-se"><span>${SEN[se]||se}</span><span>${rows.filter(a=>a.s.q).length} set</span></div><div class="libgrid">`;
    for(const {x,s} of rows){
      const t=x.t||s.u,p=t?Math.min(100,s.u/t*100):0;
      h+=`<a class="lib-row" href="#set-${x.id}">${x.sy?`<img src="${x.sy}" alt="">`:'<span></span>'}<div><b>${x.nm}</b>${x.w?'<span class="wv">FULL</span>':''}<small>${x.d.slice(0,4)} · ${x.t||'–'} kort</small><div class="bar"><i style="width:${p}%"></i></div></div><div class="ct">${s.u}/${x.t||'–'}<small>${s.q>s.u?s.q+' st':''}</small></div></a>`;
    }
    h+='</div>';
  }
  m.innerHTML=h;
}
function libSet(sid){
  if(SETMAP[sid]){return renderSet(SETMAP[sid]);}
  const x=DB.sets.find(a=>a.id===sid);if(!x)return'<p>Okänt set</p>';
  const o=ownOf(sid),s=setStat(x),full=DB.cards[sid];
  let list;
  if(full){list=full.map(([n,nm,ra,dx])=>{const mine=o.filter(c=>c.n===n);return{n,nm,ra,dx,mine}});}
  else{const g={};o.forEach(c=>{(g[c.n]=g[c.n]||{n:c.n,nm:c.nm,ra:c.ra,mine:[]}).mine.push(c)});list=Object.values(g);}
  const num=a=>parseInt(a.n)||9999;
  const F={nr:(a,b)=>num(a)-num(b)||a.n.localeCompare(b.n),namn:(a,b)=>a.nm.localeCompare(b.nm,'sv'),har:(a,b)=>(b.mine.length>0)-(a.mine.length>0)||num(a)-num(b),saknas:(a,b)=>(a.mine.length>0)-(b.mine.length>0)||num(a)-num(b),dyr:(a,b)=>Math.max(0,...b.mine.map(c=>c.r))-Math.max(0,...a.mine.map(c=>c.r))};
  list.sort(F[libSort]);
  const so=[['nr','Nummer'],['namn','Namn'],['har','Har först'],['saknas','Saknas först'],['dyr','Dyrast av mina']];
  let h=`<a href="#samling" style="font-size:13px;font-weight:700;color:var(--mute);text-decoration:none">‹ Alla set</a>
  <div class="shead">${x.sy?`<img src="${x.sy}" alt="">`:''}<div><small>${SEN[x.se]||x.se} · ${x.d.slice(0,4)}</small><h1>${x.nm}</h1></div></div>
  ${kpis([['Du har',`${s.u}<em>/${x.t||'–'}</em>`,x.t?Math.round(s.u/x.t*100)+' %':'',1],['Antal kort',s.q,''],['Värde',kr(s.val),'']])}
  ${full?'':'<div class="lnote">Hela kortlistan för det här setet kommer i en senare våg. Här visas dina kort.</div>'}
  <div class="filters" style="margin-bottom:10px"><span class="flab">Sortera</span>${so.map(([k,l])=>`<span class="chip${libSort===k?' on':''}" data-lsort="${k}">${l}</span>`).join('')}</div>
  <div class="grid">${list.map(c=>{const id=sid+'-'+c.n;return `<div class="gcard"><div class="lc${c.mine.length?'':' no'}" data-lid="${sid}|${c.n}"><div class="ph" data-img="${id}">${c.n}<br>${c.nm}</div>${c.mine.length?`<span class="q">${c.mine.reduce((a,b)=>a+b.q,0)>1?c.mine.reduce((a,b)=>a+b.q,0)+'×':'✓'}</span>`:''}</div><div class="cap">${c.nm}<small>${c.n}${x.t?'/'+x.t:''}${c.ra?' · '+c.ra:''}${c.mine.length?' · '+c.mine.map(m=>m.v).filter(Boolean).join(', '):''}</small></div></div>`}).join('')}</div>`;
  return h;
}
async function loadImgs(sid){
  let src={};
  try{
    if(DB.cards[sid]){SIMG[sid]=SIMG[sid]||await fetch('simg/'+sid+'.json').then(r=>r.json());for(const k in SIMG[sid])src[sid+'-'+k]=SIMG[sid][k];}
    else{OIMG=OIMG||await fetch('oimg.json').then(r=>r.json());src=OIMG;}
  }catch(e){}
  document.querySelectorAll('.ph[data-img]').forEach(p=>{const u=src[p.dataset.img];if(u){const i=document.createElement('img');i.loading='lazy';i.src=u;i.alt='';p.replaceWith(i)}});
}
function openLib(k){
  const [sid,n]=k.split('|');const x=DB.sets.find(a=>a.id===sid);
  const full=(DB.cards[sid]||[]).find(c=>c[0]===n);const mine=ownOf(sid).filter(c=>c.n===n);
  const nm=full?full[1]:(mine[0]||{}).nm||'';const ra=full?full[2]:(mine[0]||{}).ra||'';
  const img=document.querySelector(`[data-lid="${k}"] img`);
  const q=encodeURIComponent(`${nm} ${n}${x.t?'/'+x.t:''} ${x.nm}`);
  document.getElementById('sheet').innerHTML=`${img?`<img src="${img.src}" alt="">`:''}<h3>${nm}</h3><div class="sub">${x.nm} · ${n}${x.t?'/'+x.t:''}${ra?' · '+ra:''}${full&&full[3]?' · Pokédex #'+full[3]:''}</div>
   <div class="note">${mine.length?'Du har: '+mine.map(m=>`${m.q}× ${m.v||''}${m.r?` (~${m.r} kr)`:''}`).join(', '):'Du har inte det här kortet.'}</div>
   <a class="tr" href="https://www.tradera.com/search?q=${q}" target="_blank" rel="noopener">Sök på Tradera</a><button class="close">Stäng</button>`;
  document.getElementById('modal').classList.add('open');document.querySelector('#sheet .close').onclick=close_;
}

function render(){
  const v=(location.hash||'#pokedex').slice(1);
  if(v!=='scan')scStop();
  document.body.classList.toggle('scanmode',v==='scan');
  if(v==='scan'){['hidesw','colsw','infobtn','prog','filters','pfilters','setseg'].forEach(i=>document.getElementById(i).classList.add('hide'));document.querySelector('.legend').classList.remove('show');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==='scan'));const m=document.getElementById('main');m.classList.remove('pm');m.innerHTML=renderScan();scStart();return;}
  if(v==='byten'){['hidesw','colsw','infobtn','prog','filters','pfilters','setseg'].forEach(i=>document.getElementById(i).classList.add('hide'));document.querySelector('.legend').classList.remove('show');document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==='lista'));const m=document.getElementById('main');m.classList.remove('pm');m.innerHTML=renderTrade();m.querySelectorAll('[data-tid]').forEach(i=>scImg(i.dataset.tid).then(u=>{if(u)i.src=u}));m.onclick=e=>{const b=e.target.closest('[data-trm]');if(b){let T=JSON.parse(localStorage.getItem('bdx_trade')||'[]');T.splice(+b.dataset.trm,1);localStorage.setItem('bdx_trade',JSON.stringify(T));render()}};return;}
  if(v==='samling'||v.startsWith('set-')){['hidesw','colsw','infobtn'].forEach(i=>document.getElementById(i).classList.add('hide'));document.querySelector('.legend').classList.remove('show');renderLib(v);return;}
  document.getElementById('prog').classList.remove('hide');document.querySelector('.legend').classList.remove('hide');document.getElementById('filters').classList.remove('hide');document.getElementById('pfilters').classList.remove('hide');
  const view=SETS[v]||v==='lista'?v:'pokedex';
  prio();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view||(a.dataset.v==='set'&&!!SETS[view])));
  const sg=document.getElementById('setseg');sg.classList.toggle('hide',!SETS[view]);sg.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.s===view));
  document.querySelector('[data-f=nogen1]').classList.toggle('hide',view!=='pokedex');
  if(view!=='pokedex'&&filter==='nogen1')filter='all';
  document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('on',x.dataset.f===filter));
  document.querySelectorAll('#pfilters .chip[data-p]').forEach(x=>x.classList.toggle('on',+x.dataset.p===pf));
  const hs=document.getElementById('hidesw');hs.classList.toggle('hide',view!=='pokedex');hs.classList.toggle('on',hideDone);
  const sw=document.getElementById('colsw');sw.classList.toggle('hide',view!=='pokedex');document.getElementById('colsw_t').textContent=colmode==='set'?'Set':'Prio';sw.classList.toggle('on',colmode==='prio');
  document.getElementById('infobtn').classList.toggle('hide',view==='lista');
  document.getElementById('main').classList.toggle('pm',(view==='pokedex'&&colmode==='prio')||view==='lista');
  document.getElementById('main').innerHTML=view==='pokedex'?renderDex():view==='lista'?renderList():renderSet(view);
  document.getElementById('filters').classList.toggle('hide',view==='lista');
  stats();
  document.getElementById('prog').classList.toggle('hide',view!=='pokedex');document.querySelector('.legend').classList.toggle('hide',view==='lista');
  document.documentElement.style.setProperty('--hh',document.getElementById('hdr').offsetHeight+'px');
}

function open_(k){
  const c=DATA.cards.find(x=>key(x)===k);if(!c)return;
  const s=st(c),q=encodeURIComponent(`${c.nm.replace(/ [♂♀]/,'')} ${c.n}/${SETS[c.s].tot}`);
  document.getElementById('sheet').innerHTML=`
    <img src="img/${SETS[c.s].code}-${c.n}.webp" alt="${c.nm}">
    <h3>${c.nm}</h3>
    <div class="sub">${SETS[c.s].name} · ${c.n}/${SETS[c.s].tot}${c.d?` · Pokédex #${c.d}`:''}<br>Riktpris ~${c.r} kr · max ${mx(c)} kr</div>
    <div class="btns">${['h','v','f','m'].map(x=>`<button data-s="${x}" class="${(s===x||(x==='h'&&s==='e1'))?'on':''}">${STL[x]}</button>`).join('')}</div>
    <div class="note">${s==='e1'?'Du har en 1st Edition-version. ':''}Ändrar du status sparas det bara i den här webbläsaren.</div>
    <a class="tr" href="https://www.tradera.com/search?q=${q}" target="_blank" rel="noopener">Sök på Tradera</a>
    <button class="close">Stäng</button>`;
  document.getElementById('modal').classList.add('open');
  document.querySelectorAll('#sheet .btns button').forEach(b=>b.onclick=()=>{
    const ns=b.dataset.s;
    if(ns===c.st||(ns==='h'&&c.st==='e1'))delete OV[k];else OV[k]=ns;
    try{localStorage.setItem('pk151ov',JSON.stringify(OV))}catch(e){}
    close_();render();
  });
  document.querySelector('#sheet .close').onclick=close_;
}
function close_(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close_()});
document.getElementById('main').addEventListener('click',e=>{const lb=e.target.closest('[data-lib]');if(lb){libOnlyMine=lb.dataset.lib==='mine';render();return;}const ls=e.target.closest('[data-lsort]');if(ls){libSort=ls.dataset.lsort;render();return;}const lc=e.target.closest('[data-lid]');if(lc){openLib(lc.dataset.lid);return;}const so=e.target.closest('[data-sort]');if(so){sortBy=so.dataset.sort;render();return;}if(e.target.closest('a'))return;const t=e.target.closest('.tc');if(t)open_(t.dataset.k)});
document.getElementById('pfilters').addEventListener('click',e=>{const t=e.target.closest('.chip');if(!t)return;pf=pf===+t.dataset.p?0:+t.dataset.p;render()});
document.getElementById('colsw').onclick=()=>{colmode=colmode==='set'?'prio':'set';try{localStorage.setItem('pk151col',colmode)}catch(x){}render()};
document.getElementById('hidesw').onclick=()=>{hideDone=!hideDone;try{localStorage.setItem('pk151hide',hideDone?'1':'')}catch(x){}render()};
document.getElementById('infobtn').onclick=()=>{document.querySelector('.legend').classList.toggle('show');document.getElementById('infobtn').classList.toggle('on')};
document.getElementById('prog').addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)location.hash=t.dataset.go});
try{hideDone=!!localStorage.getItem('pk151hide')}catch(x){}
try{colmode=localStorage.getItem('pk151col')||'set'}catch(x){}
document.getElementById('filters').addEventListener('click',e=>{const t=e.target.closest('.chip');if(!t)return;filter=t.dataset.f;render()});
window.addEventListener('hashchange',render);
const MQ=matchMedia('(min-width:960px)');
function placeNav(){const n=document.getElementById('nav'),hd=document.getElementById('hdr'),br=hd.querySelector('.brand');if(MQ.matches){if(n.parentNode!==hd)br.after(n)}else if(n.parentNode!==document.body)document.body.insertBefore(n,document.getElementById('modal'))}
placeNav();MQ.addEventListener('change',()=>{placeNav();render()});
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',document.getElementById('hdr').offsetHeight+'px'));

Promise.all([fetch('data.json').then(r=>r.json()),fetch('db.json').then(r=>r.json())]).then(([d,b])=>{DATA=d;DB=b;render()}).catch(()=>{document.getElementById('main').innerHTML='<p style="padding:20px">Kunde inte läsa data.</p>'});
</script>
