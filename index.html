<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#77756f;--line:#e6e3dc;
  --har:#1f9d55;--vag:#2f6fdf;--fra:#8a4fd8;--sak:#c9c6bf;--warn:#d98a10;
  --base:#c0392b;--rocket:#5b3fa0;--jungle:#2e8b57;--fossil:#8a6d3b;
}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f2f2f2;--mute:#9a9893;--line:#2c2c2c;--sak:#3a3a3a}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
h1{font-size:17px;margin:0 0 8px;font-weight:800;letter-spacing:-.2px}
.prog{margin:10px 8px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px}
.prog h3{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.2px}
.prog table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.prog th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:700;text-align:right;padding:4px 4px;border-bottom:1.5px solid var(--ink)}
.prog th:first-child,.prog td:first-child{text-align:left}
.prog td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-weight:600}
.prog td:first-child{font-weight:800}
.prog tr.tot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:800}
.prog tr.sep td{border-bottom:0;padding:2px}
.prog .pc{font-weight:800}
.prog .mini{display:block;height:4px;background:var(--line);border-radius:3px;margin-top:3px;overflow:hidden}
.prog .mini i{display:block;height:100%;background:var(--har)}
.prog .vag{color:var(--vag);font-size:11px;font-weight:700}
.prog .foot{font-size:10.5px;color:var(--mute);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 7px}
.stat b{display:block;font-size:13.5px}
.stat span{font-size:9.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--har)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
nav::-webkit-scrollbar{display:none}
nav a,.chip{flex:none;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
nav a.on,.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{font-size:12px;padding:5px 10px}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.chip.sw{border-style:dashed}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute);padding:8px 12px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
main{padding:8px 8px 60px}
.colhead{display:grid;grid-template-columns:66px repeat(var(--nc,4),1fr);gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);padding:4px 2px;position:sticky;top:var(--hh,150px);background:var(--bg);z-index:10}
.colhead div{text-align:center}.colhead div:first-child{text-align:left;padding-left:4px}.colhead div:nth-child(2){color:var(--base)}.colhead div:nth-child(3){color:var(--jungle)}.colhead div:nth-child(4){color:var(--fossil)}.colhead div:nth-child(5){color:var(--rocket)}
.row{display:grid;grid-template-columns:66px repeat(var(--nc,4),1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-bottom:6px;align-items:center}
.lab{padding-left:4px;min-width:0}
.lab .no{font-size:11px;color:var(--mute);font-weight:600}
.lab .nm{font-size:12px;font-weight:700;line-height:1.15;word-break:break-word}
.lab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.lab .oth{font-size:9.5px;color:var(--warn);margin-top:2px;line-height:1.2}
.cell{display:flex;gap:3px;justify-content:center;min-height:60px;align-items:center}
.cell.done .tc{opacity:.4}
.pm .tc.m img,.pm .tc.f img{filter:none;opacity:1}
.pm .tc.m,.pm .tc.f{outline:none}
.pm .tc.m .rkv,.pm .tc.f .rkv{color:var(--ink)}
.pm .cell.done .tc{opacity:.55}.pm .cell.done .tc img{filter:grayscale(1) brightness(.45)}
.cell.none{color:var(--line);font-size:18px}
.tc{position:relative;flex:1 1 0;max-width:58px;cursor:pointer;border-radius:5px}
.tc img{width:100%;display:block;border-radius:4px;aspect-ratio:200/279;object-fit:cover;background:var(--line)}
.tc.m img,.tc.f img{filter:grayscale(1);opacity:.3}
.tc.m,.tc.f{outline:1.5px dashed var(--sak);outline-offset:1px}
.tc .nr{position:absolute;left:2px;top:2px;background:rgba(0,0,0,.72);color:#fff;font-size:9px;font-weight:700;padding:1px 3px;border-radius:3px}
.tc .bd{position:absolute;right:2px;bottom:18px;font-size:8.5px;font-weight:800;color:#fff;padding:1px 3px;border-radius:3px}
.tc.h .bd{background:var(--har)}.tc.e1 .bd{background:var(--har)}.tc.v .bd{background:var(--vag)}.tc.f .bd{background:var(--fra)}
.tc .rkv{display:block;text-align:center;font-size:9.5px;font-weight:700;color:var(--ink);margin-top:2px;white-space:nowrap}.tc.m .rkv,.tc.f .rkv{color:var(--mute)}.tc .rk{position:absolute;left:0;right:0;bottom:-1px;text-align:center;font-size:9px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--card)}
.tc.m .rk{bottom:30%;font-size:10px}
.tc .pr{position:absolute;right:2px;top:2px;font-size:8.5px;font-weight:800;color:#fff;padding:1px 3px;border-radius:3px}
.p1{background:#1f9d55}.p2{background:#2e8b57}.p3{background:#2f6fdf}.p4{background:#e07b00}.p5{background:#7a7a7a}
.lst{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.lst h2{margin:0;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.lst h2 small{font-weight:600;color:var(--mute);font-size:11.5px}
.lst .why{font-size:11.5px;color:var(--mute);padding:6px 12px 2px}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .tc{max-width:40px}.li .tc .rkv,.li .tc .pr{display:none}
.li b{font-size:13.5px}.li small{display:block;color:var(--mute);font-size:11.5px}
.li .kr{font-weight:800;font-size:13.5px;text-align:right}.li .kr small{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px}
.gcard .tc{max-width:none}
.gcard .cap{font-size:11.5px;font-weight:600;margin-top:4px;line-height:1.2}
.gcard .cap small{display:block;color:var(--mute);font-weight:500}
h2{font-size:14px;margin:18px 4px 8px}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet img{width:62%;display:block;margin:0 auto 10px;border-radius:10px}
.sheet h3{margin:0;font-size:18px;text-align:center}
.sheet .sub{text-align:center;color:var(--mute);font-size:13px;margin:3px 0 12px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.btns button{font:600 12px Inter,sans-serif;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btns button.on{color:#fff;border-color:transparent}
.btns button[data-s=h].on{background:var(--har)}.btns button[data-s=v].on{background:var(--vag)}.btns button[data-s=f].on{background:var(--fra)}.btns button[data-s=m].on{background:#888}
.sheet a.tr{display:block;text-align:center;font-weight:700;font-size:14px;padding:11px;border-radius:12px;background:#ffd23f;color:#1d1d1f;text-decoration:none}
.sheet .close{display:block;width:100%;margin-top:8px;padding:10px;border:0;background:none;color:var(--mute);font:600 14px Inter,sans-serif}
.note{font-size:11.5px;color:var(--mute);text-align:center;margin:6px 0 10px}
.lib-se{margin:14px 2px 6px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;justify-content:space-between}
.lib-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:6px;color:var(--ink);text-decoration:none}
.lib-row img{width:26px;height:26px;object-fit:contain}
.lib-row b{font-size:14px}.lib-row small{display:block;color:var(--mute);font-size:11.5px}
.lib-row .ct{text-align:right;font-weight:800;font-size:13px;min-width:70px}.lib-row .ct small{font-weight:600}
.lib-row .bar{margin-top:4px}
.wv{font-size:9.5px;font-weight:800;background:var(--vag);color:#fff;border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:1px}
.lc{position:relative;cursor:pointer}
.lc .ph{aspect-ratio:200/279;border-radius:5px;background:var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10.5px;color:var(--mute);padding:4px}
.lc img{width:100%;border-radius:5px;display:block;aspect-ratio:200/279;object-fit:cover}
.lc.no img{filter:grayscale(1);opacity:.3}
.lc .q{position:absolute;right:3px;top:3px;background:var(--har);color:#fff;font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px}

/* ===== Binderdex design 2 ===== */
:root{--bg:#f4f5f7;--bg2:#f4f5f7;--card:#fff;--ink:#14161a;--mute:#6b7280;--line:#e7e9ee;--sak:#d5d8de;--acc:#e3350d;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--bg2:#0f1115;--card:#181b21;--ink:#f3f4f6;--mute:#9aa3b2;--line:#262a33;--sak:#323743;--sh:0 1px 2px rgba(0,0,0,.4)}}
body{background:var(--bg);padding-bottom:calc(76px + env(safe-area-inset-bottom));letter-spacing:-.1px}
header{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand .logo{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(227,53,13,.25))}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px}
.brand small{display:block;font-size:11.5px;color:var(--mute);font-weight:500;margin-top:-1px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:8px}
.seg a{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--mute);text-decoration:none;padding:7px 0;border-radius:9px}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chip{border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;border-radius:999px;padding:6px 12px}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip.sw{border:0;box-shadow:inset 0 0 0 1px var(--line)}
.legend{font-size:10.5px;padding:8px 14px 0;gap:8px}
.prog{border:0;box-shadow:var(--sh);border-radius:18px;padding:14px;margin:12px 10px 0}
.prog h3{font-size:15px;letter-spacing:-.2px}
.prog .mini,.bar{height:6px;border-radius:6px}
.prog .mini i,.bar i{background:linear-gradient(90deg,#ff5a36,var(--acc))}
.prog th{border-bottom:1px solid var(--line)}
.prog tr.tot td{border-top:1px solid var(--line)}
main{padding:10px 10px 20px}
.row{border:0;box-shadow:var(--sh);border-radius:16px;padding:8px 6px;margin-bottom:8px}
.colhead{top:var(--hh,120px);background:color-mix(in srgb,var(--bg) 90%,transparent)}
.tc img{border-radius:6px}
.gcard{border:0;box-shadow:var(--sh);border-radius:14px;padding:6px}
.gcard .cap{font-size:12px;padding:2px 2px 1px}
.grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.lib-row{border:0;box-shadow:var(--sh);border-radius:16px;padding:12px 14px}
.lib-se{margin:18px 4px 8px;color:var(--mute);font-size:11.5px}
.lst{border:0;box-shadow:var(--sh);border-radius:18px}
.wv{background:var(--acc)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));margin:0;overflow:visible}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mute);text-decoration:none;background:none!important;border:0!important;padding:4px 0;border-radius:12px}
.tabbar svg{width:24px;height:24px;fill:currentColor;stroke:none}
.tabbar a:nth-child(4) svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar a:nth-child(4) svg circle{fill:currentColor}
.tabbar a.on{color:var(--acc)}
.sheet{border-radius:24px 24px 0 0}
.sheet a.tr{background:var(--acc);color:#fff;border-radius:14px}
</style>

function prio(){
  P={};W={};E={};
  const owned=c=>has(c)||st(c)==='v';
  for(const d of DATA.dex){
    const cs=DATA.cards.filter(c=>c.d===d.d);
    if(cs.some(c=>c.s!=='rocket'&&owned(c)))continue;
    const cands=cs.filter(c=>c.s!=='rocket'&&!owned(c));
    let t=null;
    for(const s of ['base','jungle','fossil']){
      const o=cands.filter(c=>c.s===s).sort((a,b)=>a.r-b.r);
      if(!o.length)continue;
      const ch=o[0];
      const cheaperLater=cands.some(c=>ORD.indexOf(c.s)>ORD.indexOf(s)&&c.r<ch.r*0.5);
      if(ch.r<=TOO||!cheaperLater){t=ch;break}
    }
    if(!t)continue;
    W[key(t)]=(!cs.some(owned)&&!d.o.length)?3:2;
  }
  for(const c of DATA.cards){
    if(owned(c))continue;
    const k=key(c),w=W[k]||(c.s==='rocket'?0.5:1);W[k]=w;
    const e=Math.max(c.r,5)/w;E[k]=e;
    P[k]=c.s==='rocket'?5:e<=15?1:e<=40?2:e<=250?3:4;
  }
}
function renderList(){
  const items=DATA.cards.filter(c=>P[key(c)]&&!has(c)&&st(c)!=='v');
  let h='';
  for(const t of [1,2,3,4,5]){
    if(pf&&t!==pf)continue;
    const L=items.filter(c=>P[key(c)]===t).sort((a,b)=>(E[key(a)]-E[key(b)])||(ORD.indexOf(a.s)-ORD.indexOf(b.s)));
    if(!L.length)continue;
    const sum=L.reduce((a,c)=>a+c.r,0);
    h+=`<div class="lst"><h2><span><span class="pr p${t}" style="position:static;padding:2px 5px;margin-right:6px">P${t}</span>${TIERS[t][0]}</span><small>${L.length} kort · ~${sum.toLocaleString('sv-SE')} kr</small></h2><div class="why">${TIERS[t][1]} Max = riktpris + 30 %, minst 10 kr.</div>`;
    for(const c of L){
      const q=encodeURIComponent(`${c.nm.replace(/ [♂♀]/,'')} ${c.n}/${SETS[c.s].tot}`);
      h+=`<div class="li">${thumb(c)}<div><b>${c.nm}</b><small><span style="color:${WHY[W[key(c)]][1]};font-weight:700">${WHY[W[key(c)]][0]}</span> · ${SETS[c.s].name} ${c.n}/${SETS[c.s].tot} · <a href="https://www.tradera.com/search?q=${q}" target="_blank" rel="noopener">Tradera</a></small></div><div class="kr">max ${mx(c)} kr<small>riktpris ${c.r}</small></div></div>`;
    }
    h+='</div>';
  }
  return h;
}

function stats(){
  const row=(lab,cs,tot,cls='')=>{
    const h=cs.filter(has).length,v=cs.filter(c=>st(c)==='v').length,val=cs.filter(has).reduce((a,c)=>a+c.r,0);
    const p=h/tot*100;
    return `<tr class="${cls}"><td>${lab}</td><td>${h}</td><td>${tot}</td><td class="pc">${p.toFixed(2).replace('.',',')}%<span class="mini"><i style="width:${p}%"></i></span></td><td>${v?`<span class="vag">+${v}</span>`:'–'}</td><td>${val.toLocaleString('sv-SE')}</td></tr>`;
  };
  const C=s=>DATA.cards.filter(c=>c.s===s);
  const bjf=DATA.cards.filter(c=>c.s!=='rocket');
  const g1=DATA.dex.filter(d=>d.o.length||DATA.cards.some(c=>c.d===d.d&&has(c))).length;
  const g1v=DATA.dex.filter(d=>!d.o.length&&!DATA.cards.some(c=>c.d===d.d&&has(c))&&DATA.cards.some(c=>c.d===d.d&&st(c)==='v')).length;
  document.getElementById('prog').innerHTML=`<div class="prog"><h3>Vår progress 📈</h3><table>
    <tr><th></th><th>Har</th><th>I set</th><th>% klart</th><th>På väg</th><th>Värde kr</th></tr>
    ${row('Base',C('base'),102)}${row('Jungle',C('jungle'),64)}${row('Fossil',C('fossil'),62)}
    ${row('Totalt',bjf,228,'tot')}
    <tr class="sep"><td colspan="6"></td></tr>
    ${row('Team Rocket',C('rocket'),82)}
    <tr><td>Gen 1 (arter)</td><td>${g1}</td><td>151</td><td class="pc">${(g1/151*100).toFixed(2).replace('.',',')}%<span class="mini"><i style="width:${g1/151*100}%"></i></span></td><td>${g1v?`<span class="vag">+${g1v}</span>`:'–'}</td><td></td></tr>
  </table><div class="foot">Uppdateras direkt när du ändrar status på ett kort. Värde = riktpris för korten du har.</div></div>`;
}

function pass(c){
  if(!pp(c))return false;
  const s=st(c);
  if(filter==='miss')return s==='m';
  if(filter==='incoming')return s==='v'||s==='f';
  return true;
}

function renderDex(){
  const cols=colmode==='prio'?PCOLS:Object.keys(SETS).map(s=>[s==='base'?'Base':SETS[s].name.replace('Team ',''),c=>c.s===s,`var(--${s})`]);
  document.getElementById('main').style.setProperty('--nc',cols.length);
  let hidden=0;
  let h=`<div class="colhead">${['#'].concat(cols.map(c=>c[0])).map((l,i)=>`<div style="${i?`color:${cols[i-1][2]}`:''}">${l}</div>`).join('')}</div>`;
  for(const d of DATA.dex){
    const cs=DATA.cards.filter(c=>c.d===d.d);
    const anyHave=cs.some(has), anyComing=cs.some(c=>st(c)==='v');
    const dot=anyHave?'var(--har)':anyComing?'var(--vag)':d.o.length?'var(--warn)':'#d23b3b';
    if(filter==='nogen1'&&(anyHave||d.o.length||cs.some(c=>st(c)==='v')))continue;
    if((filter==='miss'||filter==='incoming'||pf)&&!cs.some(pass))continue;
    if(hideDone&&cs.length&&cs.every(c=>has(c)||st(c)==='v')){hidden++;continue;}
    h+=`<div class="row"><div class="lab"><div class="no">#${String(d.d).padStart(3,'0')}</div><div class="nm"><span class="dot" style="background:${dot}"></span>${d.nm}</div>${!anyHave&&d.o.length?`<div class="oth">Bara: ${d.o.slice(0,2).join(', ')}</div>`:''}</div>`;
    for(const col of cols){
      const sc=cs.filter(c=>col[1](c)&&(!pf||pass(c))).sort((a,b)=>ORD.indexOf(a.s)-ORD.indexOf(b.s)||a.n-b.n);
      h+=sc.length?`<div class="cell${colmode==='prio'&&col[0].startsWith('✅')?' done':''}">${sc.map(c=>thumb(c)).join('')}</div>`:'<div class="cell none">–</div>';
    }
    h+='</div>';
  }
  if(hidden)h+=`<div class="note">${hidden} klara rader är dolda.</div>`;
  h+='<h2>Trainers & energi</h2>';
  for(const s in SETS){
    const ts=DATA.cards.filter(c=>c.s===s&&c.t&&pass(c));
    if(!ts.length)continue;
    h+=`<h2 style="color:var(--${s});font-size:13px">${SETS[s].name}</h2><div class="grid">${ts.map(gcard).join('')}</div>`;
  }
  return h;
}

const SEN={'Base':'Wizards of the Coast · Base','Gym':'Wizards of the Coast · Gym','Neo':'Wizards of the Coast · Neo','Other':'Övrigt','E-Card':'e-Card','EX':'EX','NP':'Nintendo-promos','POP':'POP','Diamond & Pearl':'Diamond & Pearl','Platinum':'Platinum','HeartGold & SoulSilver':'HeartGold & SoulSilver','Black & White':'Black & White','XY':'XY','Sun & Moon':'Sun & Moon','Sword & Shield':'Sword & Shield','Scarlet & Violet':'Scarlet & Violet','Mega Evolution':'Mega Evolution'};
function ownOf(sid){
  if(SETMAP[sid]){return DATA.cards.filter(c=>c.s===SETMAP[sid]&&has(c)).map(c=>({n:String(c.n),nm:c.nm,q:1,r:c.r}));}
  return DB.own.filter(o=>o.s===sid);
}
function setStat(x){
  const o=ownOf(x.id);const u=new Set(o.map(c=>c.n)).size;
  return {u,q:o.reduce((a,c)=>a+c.q,0),val:o.reduce((a,c)=>a+c.r*c.q,0)};
}

function libSet(sid){
  if(SETMAP[sid]){return renderSet(SETMAP[sid]);}

  const o=ownOf(sid),s=setStat(x),full=DB.cards[sid];

  if(full){list=full.map(([n,nm,ra,dx])=>{const mine=o.filter(c=>c.n===n);return{n,nm,ra,dx,mine}});}
  else{const g={};o.forEach(c=>{(g[c.n]=g[c.n]||{n:c.n,nm:c.nm,ra:c.ra,mine:[]}).mine.push(c)});list=Object.values(g);}
  const num=a=>parseInt(a.n)||9999;
  const F={nr:(a,b)=>num(a)-num(b)||a.n.localeCompare(b.n),namn:(a,b)=>a.nm.localeCompare(b.nm,'sv'),har:(a,b)=>(b.mine.length>0)-(a.mine.length>0)||num(a)-num(b),saknas:(a,b)=>(a.mine.length>0)-(b.mine.length>0)||num(a)-num(b),dyr:(a,b)=>Math.max(0,...b.mine.map(c=>c.r))-Math.max(0,...a.mine.map(c=>c.r))};
  list.sort(F[libSort]);
  const so=[['nr','Nummer'],['namn','Namn'],['har','Har först'],['saknas','Saknas först'],['dyr','Dyrast av mina']];
  let h=`<a href="#samling" style="font-size:13px;font-weight:700;color:var(--mute);text-decoration:none">‹ Alla set</a>
  <div class="prog" style="margin:6px 0 10px"><h3 style="display:flex;gap:8px;align-items:center">${x.sy?`<img src="${x.sy}" style="width:22px;height:22px">`:''}${x.nm}</h3><table>

   <tr><td>Antal kort</td><td>${x.t||'–'}${x.ta>x.t?` (+${x.ta-x.t} hemliga)`:''}</td></tr>
   <tr><td>Du har</td><td>${s.u} unika${x.t?` (${Math.round(s.u/x.t*100)} %)`:''} · ${s.q} st</td></tr>
   <tr><td>Värde på dina</td><td>~${s.val.toLocaleString('sv-SE')} kr</td></tr></table>

  return h;
}
async function loadImgs(sid){
  let src={};
  try{
    if(DB.cards[sid]){SIMG[sid]=SIMG[sid]||await fetch('simg/'+sid+'.json').then(r=>r.json());for(const k in SIMG[sid])src[sid+'-'+k]=SIMG[sid][k];}
    else{OIMG=OIMG||await fetch('oimg.json').then(r=>r.json());src=OIMG;}

  document.querySelectorAll('.ph[data-img]').forEach(p=>{const u=src[p.dataset.img];if(u){const i=document.createElement('img');i.loading='lazy';i.src=u;i.alt='';p.replaceWith(i)}});
}

    <img src="img/${SETS[c.s].code}-${c.n}.webp" alt="${c.nm}">
    <h3>${c.nm}</h3>
    <div class="sub">${SETS[c.s].name} · ${c.n}/${SETS[c.s].tot}${c.d?` · Pokédex #${c.d}`:''}<br>Riktpris ~${c.r} kr · max ${mx(c)} kr</div>
    <div class="btns">${['h','v','f','m'].map(x=>`<button data-s="${x}" class="${(s===x||(x==='h'&&s==='e1'))?'on':''}">${STL[x]}</button>`).join('')}</div>
    <div class="note">${s==='e1'?'Du har en 1st Edition-version. ':''}Ändrar du status sparas det bara i den här webbläsaren.</div>
    <a class="tr" href="https://www.tradera.com/search?q=${q}" target="_blank" rel="noopener">Sök på Tradera</a>
    <button class="close">Stäng</button>`;
  document.getElementById('modal').classList.add('open');
  document.querySelectorAll('#sheet .btns button').forEach(b=>b.onclick=()=>{
    const ns=b.dataset.s;
    if(ns===c.st||(ns==='h'&&c.st==='e1'))delete OV[k];else OV[k]=ns;
    try{localStorage.setItem('pk151ov',JSON.stringify(OV))}catch(e){}
    close_();render();
  });
  document.querySelector('#sheet .close').onclick=close_;
}
function close_(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close_()});
document.getElementById('main').addEventListener('click',e=>{const lb=e.target.closest('[data-lib]');if(lb){libOnlyMine=lb.dataset.lib==='mine';render();return;}const ls=e.target.closest('[data-lsort]');if(ls){libSort=ls.dataset.lsort;render();return;}const lc=e.target.closest('[data-lid]');if(lc){openLib(lc.dataset.lid);return;}const so=e.target.closest('[data-sort]');if(so){sortBy=so.dataset.sort;render();return;}if(e.target.closest('a'))return;const t=e.target.closest('.tc');if(t)open_(t.dataset.k)});
document.getElementById('pfilters').addEventListener('click',e=>{const t=e.target.closest('.chip');if(!t)return;if(t.dataset.c){colmode=colmode==='set'?'prio':'set';try{localStorage.setItem('pk151col',colmode)}catch(x){}}else if(t.dataset.h){hideDone=!hideDone;try{localStorage.setItem('pk151hide',hideDone?'1':'')}catch(x){}}else pf=+t.dataset.p;render()});
try{hideDone=!!localStorage.getItem('pk151hide')}catch(x){}
try{colmode=localStorage.getItem('pk151col')||'set'}catch(x){}
document.getElementById('filters').addEventListener('click',e=>{const t=e.target.closest('.chip');if(!t)return;filter=t.dataset.f;render()});
window.addEventListener('hashchange',render);
window.addEventListener('resize',()=>document.documentElement.style.setProperty('--hh',document.getElementById('hdr').offsetHeight+'px'));

Promise.all([fetch('data.json').then(r=>r.json()),fetch('db.json').then(r=>r.json())]).then(([d,b])=>{DATA=d;DB=b;render()}).catch(()=>{document.getElementById('main').innerHTML='<p style="padding:20px">Kunde inte läsa data.</p>'});
</script>
</body>
</html>
